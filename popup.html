<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; color: #222; background: #fff; }
    h1 { font-size: 15px; margin: 0; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    textarea { width: 100%; height: 140px; box-sizing: border-box; resize: vertical; font: inherit; padding: 6px; }
    label { display: flex; align-items: center; gap: 6px; }
    fieldset { border: 0; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 4px; }
    .hint { color: #777; font-size: 11px; margin: 4px 0 0; }
    @media (prefers-color-scheme: dark) {
      body { background: #1f1f23; color: #eee; }
      textarea { background: #2b2b31; color: #eee; border: 1px solid #444; }
      .hint { color: #999; }
    }
  </style>
</head>
<body>
  <header>
    <h1>NoSpoil</h1>
    <label><input type="checkbox" id="enabled"> Enabled</label>
  </header>

  <textarea id="keywords" placeholder="One keyword or phrase per line" spellcheck="false"></textarea>
  <p class="hint">Case-insensitive. Saved as you type.</p>

  <fieldset>
    <label><input type="radio" name="mode" value="blur"> Blur (click to reveal)</label>
    <label><input type="radio" name="mode" value="hide"> Hide completely</label>
    <label><input type="checkbox" id="wholeWord"> Match whole words only</label>
  </fieldset>

  <script src="popup.js"></script>
</body>
</html>
